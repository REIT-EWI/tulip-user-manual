# Shared benchmark configuration.
#
# The scripts in this directory source this file by default.
# Keep one active value per setting and comment out alternatives you do not want.

## Common run metadata
RUN_DATE=2026-04-30
LIMIT_MODE=prod-limits

## Chat completions scenario
# CAPABILITY=chat
# MODEL_ALIAS=chat
# ENDPOINT_TYPE=chat
# SCENARIO=isl1000-osl300
# TOKENIZER=openai/gpt-oss-20b
# ISL=1000
# OSL=300
# CONCURRENCY_LEVELS="80 90 100"
# REQUEST_MULTIPLIER=10

## Code generation scenario
CAPABILITY=code
MODEL_ALIAS=code
ENDPOINT_TYPE=chat
TOKENIZER=Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
ISL=4000 # consider: isl1000; isl4000; isl16000; isl32000
OSL=800  # consider: osl300; osl800;  osl1000;  osl1000
comment="_64k-model-length" # optional freeform comment to distinguish scenarios with same ISL/OSL (e.g. if you want to run multiple code scenarios with different prompt styles)
SCENARIO=isl${ISL}-osl${OSL}${comment}
CONCURRENCY_LEVELS="1 16 32 64"
REQUEST_MULTIPLIER=10

