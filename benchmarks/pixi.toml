[workspace]
authors = ["Azza Ahmed <a.e.ahmed@tudelft.nl>"]
channels = ["conda-forge"]
name = "benchmarks"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
plot-dashboard = "bash -lc 'aiperf plot --dashboard \"${AIPERF_DIR:-artifacts}\"'"

[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
aiperf = ">=0.7.0, <0.8"
