[workspace]
authors = ["Azza Ahmed <a.e.ahmed@tudelft.nl>"]
channels = ["conda-forge"]
name = "tulip-quick-tests"
description = "Smoke tests for Dynamo/vLLM OpenAI-compatible endpoint"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
chat = "python examples/python_chat_completions.py"
smoke = "bash tests/smoke.sh"
smoke-full = "bash tests/smoke-full.sh"
lint = "ruff check --fix examples"
format = "ruff format examples"
fix = { depends-on = ["format", "lint"] }
install-hooks = "pre-commit install"
lint-docs = "markdownlint 'docs/content/**/*.md' 'readme.md'"
format-docs = "markdownlint --fix 'docs/content/**/*.md' 'readme.md'"
fix-docs = { depends-on = ["format-docs", "lint-docs"] }
pre-commit = "pre-commit run --all-files"



[pypi-dependencies]
asyncio = ">=4.0.0, <5"
openai = { version = ">=2.3.0, <3", extras = ["realtime"] }
dotenv = ">=0.9.9, <0.10"
pydantic = "*"

[dependencies]
python = ">=3.14.0,<3.15"
copier = ">=9.10.3,<10"
jq = ">=1.8.1,<2"
ruff = ">=0.15.9,<0.16"
pre-commit = ">=4.5.1,<5"
markdownlint-cli = ">=0.48.0,<0.49"
nodejs = ">=24.14.1,<24.15"
