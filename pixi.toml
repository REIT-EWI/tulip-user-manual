[workspace]
authors = ["Azza Ahmed <a.e.ahmed@tudelft.nl>"]
channels = ["conda-forge"]
name = "tulip-quick-tests"
description = "Smoke tests for Dynamo/vLLM OpenAI-compatible endpoint"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
chat = "python examples/python_chat_completions.py"
smoke = "bash tests/smoke.sh"
smoke-full = "bash tests/smoke-full.sh"

[pypi-dependencies]
asyncio = ">=4.0.0, <5"
openai = { version = ">=2.3.0, <3", extras = ["realtime"] }
dotenv = ">=0.9.9, <0.10"
pydantic = "*"

[dependencies]
python = ">=3.14.0,<3.15"
copier = ">=9.10.3,<10"
jq = ">=1.8.1,<2"
