repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        files: ^examples/.*\.pyi?$
        args: [--fix, --show-fixes]
      - id: ruff-format
        files: ^examples/.*\.pyi?$

  - repo: local
    hooks:
      - id: markdownlint-pixi
        name: markdownlint via pixi
        entry: pixi run format-docs
        language: system
        pass_filenames: false
        files: ^(docs/content/.*\.md$|readme\.md$)
        exclude: ^docs/public/

