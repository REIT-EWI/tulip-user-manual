[project]
site_name = "TULIP Docs"
site_description = "Guides, tutorials, and reference information."
site_author = "Azza Ahmed"

site_dir = "public/"
site_url = "https://docs.tulip.tudelft.nl/"
docs_dir = "content/"
repo_url = "https://gitlab.ewi.tudelft.nl/tulip/reference-tests"
edit_uri = "https://gitlab.ewi.tudelft.nl/tulip/reference-tests/-/tree/main/docs/content/"

extra_css = ["assets/extra.css"]

nav = [
  {"Home" = "index.md"},
  {"Getting Started" = "getting_started.md"},
  {"Changelog" = "changelog.md"},
  {"Roadmap" = "roadmap.md"},
]


[project.theme]
language = "en"
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.top",
    "navigation.indexes",
    "content.code.annotate",
    "content.code.copy",
    "content.action.edit",
    "content.action.view",
]
font.code = "JetBrains Mono"
# logo = "assets/tulip-logo.png"
# favicon = "images/favicon.png"


[project.theme.icon]
#favicon = "fontawesome/regular/flower-tulip"
#favicon = "mdi:flower-tulip-outline"
#favicon = "lucide:flower-2"
repo = "fontawesome/brands/gitlab"

[[project.theme.palette]] 
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"
