[project]
site_name = "TULIP Docs"
site_description = "Guides, tutorials, and reference information."
site_author = "Azza Ahmed"

site_dir = "public/"
site_url = "https://docs.tulip.tudelft.nl/"
docs_dir = "content/"
repo_url = "https://gitlab.ewi.tudelft.nl/tulip/reference-tests"
edit_uri = "https://gitlab.ewi.tudelft.nl/tulip/reference-tests/-/tree/main/docs/content/"

extra_css = ["assets/extra.css"]

nav = [
    {"Home" = "index.md"},
    {"Getting Started" = [
        {"Overview" = "getting-started/index.md"},
        {"Your First Request" = "getting-started/first-interaction.md"},
        {"Available Models" = "getting-started/model-mapping.md"},
        {"API Reference" = "getting-started/api_reference.md"},
        {"Limits & Feedback" = "getting-started/limits-feedback.md"}
    ]},
    {"Tutorials" = [
        {"Overview" = "tutorials/index.md"},
        {"Chat & General Inference" = "tutorials/chat-inference.md"},
        {"Embeddings" = "tutorials/embeddings.md"},
        {"Tool Calling" = "tutorials/tool_calling.md"},
        {"OpenHarness Integration" = "tutorials/openharness.md"}
    ]},
    {"Data handling" = "data_handling.md"},
    {"Changelog" = "changelog.md"},
    {"Roadmap" = "roadmap.md"}
]

[project.theme]
language = "en"
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",
    "toc.follow",
    "content.code.annotate",
    "content.code.select",
    "content.code.copy",
    "content.action.edit",
    "content.action.view",
]
font.code = "JetBrains Mono"
# logo = "assets/tulip-logo.png"
# favicon = "images/favicon.png"


[project.theme.icon]
#favicon = "fontawesome/regular/flower-tulip"
#favicon = "mdi:flower-tulip-outline"
#favicon = "lucide:flower-2"
repo = "fontawesome/brands/gitlab"

[[project.theme.palette]] 
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# For adding code snippets- per: https://pypi.org/project/zensical-code-references/
[project.markdown_extensions.zensical_symbolic_snippets]
module_roots = ["src"]
fail_on_unresolved = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.snippets]
base_path = ["..", "../tests", "."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]
